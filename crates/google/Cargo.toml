[package]
name = "gcal-google"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
toml = "1.2.1"
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
