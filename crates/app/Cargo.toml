[package]
name = "gcal-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Starts Slint's embedded test server (when SLINT_MCP_PORT is set) so the interface can be
# driven and screenshotted automatically. Never enabled in release builds.
ui-testing = ["slint/mcp"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
gcal-core = { version = "0.1.0", path = "../core" }
gcal-google = { version = "0.1.0", path = "../google" }
gcal-store = { version = "0.1.0", path = "../store" }
gcal-sync = { version = "0.1.0", path = "../sync" }
iana-time-zone = "0.1.65"
# Already built for Slint; only the formats Google serves profile pictures in.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
oo7 = "0.7.1"
open = "5.4.5"
serde_json = "1.0.154"
slint = "1.18"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }

[build-dependencies]
slint-build = "1.18"
