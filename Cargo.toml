[workspace]
resolver = "3"
members = ["crates/core", "crates/google", "crates/store", "crates/sync", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
# "deny" rather than "forbid": the code Slint generates for the interface carries its own
# allow(unsafe_code), which "forbid" would turn into a build error. Our own code stays safe.
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
